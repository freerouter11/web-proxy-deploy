name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build-tools 35 + platform 34
        run: |
          set -e
          mkdir -p $HOME/android
          curl -sSL -o $HOME/android/bt.zip https://dl.google.com/android/repository/build-tools_r35_linux.zip
          unzip -q $HOME/android/bt.zip -d $HOME/android/bt
          curl -sSL -o $HOME/android/p34.zip https://dl.google.com/android/repository/platform-34-ext7_r03.zip
          unzip -q $HOME/android/p34.zip -d $HOME/android/p34
          echo "TOOLS_DIR=$HOME/android/bt/android-15" >> $GITHUB_ENV
          echo "ANDROID_JAR=$HOME/android/p34/android-34/android.jar" >> $GITHUB_ENV

      - name: Keystore (from secrets, or fresh key if fork)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -e
          cd android-app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          else
            # fork بدون سیکریت: کلید تازه می‌سازد (امضا با ریلیزهای رسمی فرق دارد)
            keytool -genkeypair -keystore keystore.jks -alias webproxy \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KS_PASS:-forkbuild}" -keypass "${KS_PASS:-forkbuild}" \
              -dname "CN=Web Proxy Fork, O=Fork"
          fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd android-app
          TOOLS_DIR="$TOOLS_DIR" ANDROID_JAR="$ANDROID_JAR" \
          KEYSTORE=keystore.jks \
          KS_PASS="${KS_PASS:-webproxy2024}" KS_ALIAS="${KS_ALIAS:-webproxy}" KEY_PASS="${KEY_PASS:-webproxy2024}" \
          OUT=../WebProxy.apk scripts/build-apk.sh

      - name: Verify
        run: |
          TOOLS_DIR="$TOOLS_DIR" $TOOLS_DIR/aapt dump badging WebProxy.apk | head -3
          $TOOLS_DIR/apksigner verify --print-certs WebProxy.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: WebProxy-APK
          path: WebProxy.apk
          retention-days: 90
